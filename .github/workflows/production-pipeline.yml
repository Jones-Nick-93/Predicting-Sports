name: Production data pipeline

on:
  push:
    paths:
      - "data/production-pipeline/**"
      - ".github/workflows/production-pipeline.yml"
  pull_request:
    paths:
      - "data/production-pipeline/**"
      - ".github/workflows/production-pipeline.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 1"

permissions:
  contents: read

jobs:
  test-and-synthetic-ingestion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data/production-pipeline
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: data/production-pipeline/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/demo.py
      - run: python -m compileall -q src scripts tests
