name: As-of news NLP lab

on:
  push:
    paths:
      - "ml/asof-news-nlp/**"
      - ".github/workflows/asof-news-nlp.yml"
  pull_request:
    paths:
      - "ml/asof-news-nlp/**"
      - ".github/workflows/asof-news-nlp.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml/asof-news-nlp
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ml/asof-news-nlp/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python examples/run_demo.py
      - run: python -m compileall -q src examples tests
