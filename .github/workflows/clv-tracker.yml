name: Odds CLV tracker

on:
  push:
    paths:
      - "odds/clv-tracker/**"
      - ".github/workflows/clv-tracker.yml"
  pull_request:
    paths:
      - "odds/clv-tracker/**"
      - ".github/workflows/clv-tracker.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: odds/clv-tracker
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: odds/clv-tracker/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/demo.py
      - run: python -m compileall -q src scripts tests
