name: Resilient API client

on:
  push:
    paths:
      - "data/resilient-api-client/**"
      - ".github/workflows/resilient-api-client.yml"
  pull_request:
    paths:
      - "data/resilient-api-client/**"
      - ".github/workflows/resilient-api-client.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data/resilient-api-client
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: data/resilient-api-client/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m compileall -q resilient_client.py test_resilient_client.py examples
      - run: python examples/run_demo.py
