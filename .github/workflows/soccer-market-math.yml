name: Soccer market math

on:
  push:
    paths:
      - "soccer/market-math/**"
      - ".github/workflows/soccer-market-math.yml"
  pull_request:
    paths:
      - "soccer/market-math/**"
      - ".github/workflows/soccer-market-math.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soccer/market-math
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: soccer/market-math/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run example
        run: python examples/run_market_math.py
      - name: Compile source
        run: python -m compileall -q src examples
