name: Statistical experiment governance

on:
  push:
    paths:
      - "statistics/experiment-governance/**"
      - ".github/workflows/experiment-governance.yml"
  pull_request:
    paths:
      - "statistics/experiment-governance/**"
      - ".github/workflows/experiment-governance.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: statistics/experiment-governance
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: statistics/experiment-governance/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python examples/run_governance_demo.py
      - run: python -m compileall -q src examples tests
