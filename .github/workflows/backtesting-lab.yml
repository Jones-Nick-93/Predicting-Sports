name: Leakage-safe backtesting lab

on:
  push:
    paths:
      - "backtesting/leakage-safe-lab/**"
      - ".github/workflows/backtesting-lab.yml"
  pull_request:
    paths:
      - "backtesting/leakage-safe-lab/**"
      - ".github/workflows/backtesting-lab.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backtesting/leakage-safe-lab
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backtesting/leakage-safe-lab/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/demo.py
      - run: python -m compileall -q src scripts tests
