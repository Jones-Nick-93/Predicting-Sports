name: Market invariants lab

on:
  push:
    paths:
      - "odds/market-invariants/**"
      - ".github/workflows/market-invariants.yml"
  pull_request:
    paths:
      - "odds/market-invariants/**"
      - ".github/workflows/market-invariants.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: odds/market-invariants
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: odds/market-invariants/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python examples/run_invariants_demo.py
      - run: python -m compileall -q src examples tests
