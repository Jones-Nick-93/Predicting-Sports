name: Uncertainty gates

on:
  push:
    paths:
      - "statistics/uncertainty-gates/**"
      - ".github/workflows/uncertainty-gates.yml"
  pull_request:
    paths:
      - "statistics/uncertainty-gates/**"
      - ".github/workflows/uncertainty-gates.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: statistics/uncertainty-gates
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: statistics/uncertainty-gates/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python examples/run_uncertainty_demo.py
      - run: python -m compileall -q src examples tests
