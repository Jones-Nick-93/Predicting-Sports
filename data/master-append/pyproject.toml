[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "master-append-demo"
version = "0.1.0"
description = "Idempotent reconciliation helpers for Excel-based scheduled reports"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["pandas>=1.5", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[tool.setuptools]
py-modules = ["master_append"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["."]
