[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "resilient-api-client-demo"
version = "0.1.0"
description = "Provider-neutral resilience patterns for unattended API jobs"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[tool.setuptools]
py-modules = ["resilient_client"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["."]
